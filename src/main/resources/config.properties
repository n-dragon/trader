# ================================================
# Binance Trading Bot Configuration
# ================================================

# Global Settings
trading.mode=paper
max.concurrent.trades=3
total.capital=10000

# ================================================
# BTCUSDT Configuration
# ================================================
BTCUSDT.enabled=true
BTCUSDT.window_size=10
BTCUSDT.threshold=0.5
BTCUSDT.max_position=2.0
BTCUSDT.stop_loss=1.5
BTCUSDT.take_profit=3.0
BTCUSDT.min_volume=1000000

# ================================================
# ETHUSDT Configuration
# ================================================
ETHUSDT.enabled=true
ETHUSDT.window_size=15
ETHUSDT.threshold=0.7
ETHUSDT.max_position=3.0
ETHUSDT.stop_loss=2.0
ETHUSDT.take_profit=4.0
ETHUSDT.min_volume=500000

# ================================================
# Risk Management
# ================================================
risk.max_daily_loss=5.0
risk.max_drawdown=15.0
risk.max_position_size=2.0
risk.circuit_breaker.enabled=true
risk.circuit_breaker.consecutive_losses=5

# ================================================
# Notifications
# ================================================
notifications.enabled=false

# Telegram Configuration
notifications.telegram.enabled=false
notifications.telegram.token=YOUR_BOT_TOKEN
notifications.telegram.chat_id=YOUR_CHAT_ID

# Email Configuration
notifications.email.enabled=false
notifications.email.smtp_host=smtp.gmail.com
notifications.email.smtp_port=587
notifications.email.username=your_email@gmail.com
notifications.email.password=your_app_password
notifications.email.recipient=recipient@email.com

# ================================================
# API Configuration
# ================================================
# Binance API (set via environment variables for security)
# BINANCE_API_KEY=your_api_key
# BINANCE_SECRET_KEY=your_secret_key

# API Rate Limits
api.max_requests_per_minute=1200
api.safety_margin=100

# ================================================
# Advanced Settings
# ================================================
# Latency Management
latency.max_acceptable_ms=200
latency.clock_sync_interval_ms=60000

# Backtest Settings
backtest.warmup_period=50
backtest.min_confidence=0.5
backtest.risk_per_trade=2.0

# Multi-Exchange Validation
validation.max_deviation=0.01
validation.min_exchanges=3
